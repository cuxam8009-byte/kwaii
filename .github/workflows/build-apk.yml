name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        id: prep
        run: |
          if [ -f project.zip ]; then
            rm -rf proj
            unzip -o project.zip -d proj
          else
            mkdir -p proj
            rsync -a --exclude .git --exclude proj ./ proj/
          fi
          ROOT=$(dirname "$(find proj -maxdepth 2 -name settings.gradle.kts | head -1)")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test and build debug APK
        working-directory: ${{ steps.prep.outputs.root }}
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pigprolem-utit-apk
          path: ${{ steps.prep.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
